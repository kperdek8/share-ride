version: '3.8'

services:
  # Backend - Test FastAPI
  backend_test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shareride-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/shareride
      - MONGODB_URL=mongodb://mongodb:27017/shareride
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - mongodb
      - redis
    networks:
      - shareride-network

  # Backend - Test FastAPI
  matching_service:
    build:
      context: ./backend/matching_service
      dockerfile: Dockerfile
    container_name: shareride-backend-matching-service
    ports:
      - "8001:8000"
    volumes:
      - ./backend/matching_service:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/shareride
      - MONGODB_URL=mongodb://mongodb:27017/shareride
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - mongodb
      - redis
    networks:
      - shareride-network
      
  ride_management_service:
    build:
      context: ./backend/ride_management_service
      dockerfile: Dockerfile
    container_name: shareride-backend-ride-management-service
    ports:
      - "8002:8000"
    volumes:
      - ./backend/ride_management_service:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/shareride
      - MONGODB_URL=mongodb://mongodb:27017/shareride
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - mongodb
      - redis
    networks:
      - shareride-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: shareride-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=shareride
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shareride-network

  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: shareride-mongodb
    environment:
      - MONGO_INITDB_DATABASE=shareride
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - shareride-network
  # Redis
  redis:
    image: redis:latest
    container_name: shareride-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - shareride-network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  shareride-network:
    driver: bridge

